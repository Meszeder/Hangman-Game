<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการคำศัพท์ (Admin) - LiberalArtsRSU</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #FFF7E8;
            color: #2D2A32;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 24px;
            border: 3px solid #2D2A32;
            box-shadow: 6px 6px 0 #2D2A32;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h2 { color: #6C5CE7; margin-top: 0; }
        p { color: #666; font-size: 15px; line-height: 1.6; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            font-family: 'Kanit', sans-serif;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #2D2A32;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 3px 3px 0 #2D2A32;
            text-decoration: none;
            box-sizing: border-box;
        }
        .btn-sheet { background-color: #2ED9A6; color: #fff; }
        .btn-game { background-color: #6C5CE7; color: #fff; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚙️ เมนูแอดมินจัดการคำศัพท์</h2>
    <p>กดปุ่มด้านล่างเพื่อเปิด Google Sheets และพิมพ์คำศัพท์เพิ่มหรือลบในคอลัมน์ A ได้เลยครับ (คำศัพท์จะอัปเดตไปที่หน้าเล่นเกมของเด็กทุกคนทันที)</p>
    
    <a href="https://docs.google.com/spreadsheets/d/16BJGnDFSjwjIFT57SI5vy0vt0-kVt1DKndFMLw9R_FU/edit?usp=sharing" target="_blank" class="btn btn-sheet">📝 เปิดตารางแก้คำศัพท์ (Google Sheets)</a>
    
    <a href="../" class="btn btn-game">🎮 ไปหน้าเล่นเกม</a>
</div>

</body>
</html>
