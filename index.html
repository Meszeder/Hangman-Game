<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกม Hangman - LiberalArtsRSU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sun:      #FFC93C;
            --coral:    #FF6B6B;
            --sky:      #38BDF8;
            --grass:    #2ED9A6;
            --grape:    #6C5CE7;
            --cream:    #FFF7E8;
            --paper:    #FFFFFF;
            --ink:      #2D2A32;
            --shadow:   rgba(45, 42, 50, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Kanit', sans-serif;
            background:
                radial-gradient(circle at 12% 18%, rgba(56,189,248,0.16) 0, transparent 40%),
                radial-gradient(circle at 88% 12%, rgba(255,107,107,0.16) 0, transparent 38%),
                radial-gradient(circle at 90% 85%, rgba(46,217,166,0.16) 0, transparent 40%),
                var(--cream);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 16px 60px;
            color: var(--ink);
            position: relative;
            overflow: hidden;
        }

        h2.title {
            font-family: 'Chonburi', sans-serif;
            font-size: 30px;
            color: var(--grape);
            text-shadow: 2px 3px 0 var(--sun);
            margin: 0 0 22px;
            text-align: center;
        }

        .container {
            background: var(--paper);
            padding: 28px 26px 32px;
            border-radius: 28px;
            border: 3px solid var(--ink);
            box-shadow: 8px 8px 0 var(--shadow);
            text-align: center;
            max-width: 520px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        #mascot { font-size: 34px; }
        #streak {
            font-size: 14px;
            font-weight: 700;
            background: var(--cream);
            border: 2px solid var(--ink);
            border-radius: 999px;
            padding: 4px 12px;
        }

        .stage {
            background: linear-gradient(180deg, #FFF1CE 0%, var(--cream) 100%);
            border: 3px solid var(--ink);
            border-radius: 20px;
            padding: 10px 0 0;
            margin: 4px auto 8px;
            width: 210px;
        }

        #hangman-svg {
            width: 200px;
            height: 230px;
            stroke: var(--grape);
            stroke-width: 5;
            fill: none;
            stroke-linecap: round;
        }

        #hangman-svg line:nth-of-type(-n+4) { stroke: #B08B4F; }
        #part-1 { fill: var(--sun); stroke: var(--ink); }
        #part-2, #part-3, #part-4, #part-5, #part-6 { stroke: var(--coral); }

        #word-display {
            font-family: 'Chonburi', sans-serif;
            font-size: 32px;
            letter-spacing: 12px;
            margin: 22px 0 8px;
        }

        #keyboard {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 7px;
            margin-top: 18px;
        }

        .key {
            padding: 10px 13px;
            font-size: 16px;
            font-weight: 700;
            background-color: var(--paper);
            color: var(--grape);
            border: 2.5px solid var(--grape);
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .key:active:not(:disabled) { transform: translateY(2px); }
        .key:disabled { opacity: 0.5; cursor: not-allowed; }
        .key.correct { background-color: #D6F7EC; border-color: var(--grass); color: #1AA179; }
        .key.wrong   { background-color: #FFE3E3; border-color: var(--coral); color: var(--coral); }

        #message { font-size: 18px; font-weight: 700; margin-top: 18px; }
        .win { color: #1AA179; animation: pop 0.4s ease; }
        .lose { color: var(--coral); animation: shake 0.4s ease; }

        button.btn-next {
            font-family: 'Kanit', sans-serif;
            padding: 12px 28px;
            font-size: 18px;
            font-weight: 700;
            background-color: var(--sun);
            color: var(--ink);
            border: 3px solid var(--ink);
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--ink);
            animation: pop 0.3s ease;
            transition: transform 0.1s ease;
        }

        button.btn-next:hover { transform: translateY(-2px); }
        button.btn-next:active { transform: translateY(2px); box-shadow: 2px 2px 0 var(--ink); }

        @keyframes pop {
            0% { transform: scale(0.7); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        /* ------------------ Effect Styles ------------------ */
        .firework-particle {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            animation: explode 1s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        .sad-drop {
            position: fixed;
            top: -30px;
            font-size: 24px;
            pointer-events: none;
            z-index: 999;
            animation: fall 2s linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

<h2 class="title">🎪 เกม Hangman หรรษา</h2>

<div class="container">
    <div class="top-bar">
        <div id="mascot">😃</div>
        <div id="streak">🔥 ต่อเนื่อง: 0</div>
    </div>

    <div class="stage">
        <svg id="hangman-svg">
            <line x1="10" y1="220" x2="150" y2="220" />
            <line x1="40" y1="220" x2="40" y2="20" />
            <line x1="40" y1="20" x2="120" y2="20" />
            <line x1="120" y1="20" x2="120" y2="50" />
            <circle id="part-1" cx="120" cy="70" r="20" style="display:none;" />
            <line id="part-2" x1="120" y1="90" x2="120" y2="150" style="display:none;" />
            <line id="part-3" x1="120" y1="110" x2="90" y2="130" style="display:none;" />
            <line id="part-4" x1="120" y1="110" x2="150" y2="130" style="display:none;" />
            <line id="part-5" x1="120" y1="150" x2="90" y2="190" style="display:none;" />
            <line id="part-6" x1="120" y1="150" x2="150" y2="190" style="display:none;" />
            <g id="part-7" style="display:none;">
                <line x1="110" y1="65" x2="118" y2="73" stroke="red" stroke-width="2"/>
                <line x1="118" y1="65" x2="110" y2="73" stroke="red" stroke-width="2"/>
                <line x1="122" y1="65" x2="130" y2="73" stroke="red" stroke-width="2"/>
                <line x1="130" y1="65" x2="122" y2="73" stroke="red" stroke-width="2"/>
            </g>
        </svg>
    </div>

    <div id="word-display">_ _ _ _</div>
    <div id="message"></div>
    <div id="next-round-box" style="margin-top: 14px;"></div>
    <div id="keyboard"></div>
</div>

<script>
    const DEFAULT_WORDS = ["CAT", "DOG", "BIRD", "FISH", "LION", "ELEPHANT"];
    let wordList = [];
    let secretWord = "";
    let guessedLetters = [];
    let wrongGuesses = 0;
    let streak = 0;
    const maxWrong = 7;

    function createKeyboard() {
        const keyboard = document.getElementById('keyboard');
        keyboard.innerHTML = '';
        for (let i = 65; i <= 90; i++) {
            const letter = String.fromCharCode(i);
            const btn = document.createElement('button');
            btn.innerText = letter;
            btn.className = 'key';
            btn.id = `key-${letter}`;
            btn.onclick = () => handleGuess(letter);
            keyboard.appendChild(btn);
        }
    }

    // เริ่มรอบใหม่: ดึงคำศัพท์ล่าสุดทุกครั้งที่กดเริ่ม
    function startRound() {
        // ดึงข้อมูลคำศัพท์ที่แอดมินเพิ่งบันทึกมาสดๆ ร้อนๆ
        const saved = localStorage.getItem('rsu_hangman_words');
        if (saved) {
            wordList = JSON.parse(saved);
        } else {
            wordList = [...DEFAULT_WORDS];
        }

        if (wordList.length === 0) return;

        // สุ่มคำใหม่แบบไม่ให้ซ้ำคำเดิม (ถ้ามีคำในระบบมากกว่า 1 คำ)
        let newWord = secretWord;
        if (wordList.length > 1) {
            while (newWord === secretWord) {
                newWord = wordList[Math.floor(Math.random() * wordList.length)];
            }
        } else {
            // ถ้าแอดมินใส่มาคำเดียว ก็ต้องยอมให้ซ้ำครับ
            newWord = wordList[0];
        }
        secretWord = newWord;

        // ล้างค่าของรอบเก่า
        guessedLetters = [];
        wrongGuesses = 0;
        document.getElementById('mascot').innerText = '😃';
        document.getElementById('message').innerText = '';
        document.getElementById('message').className = '';
        document.getElementById('next-round-box').innerHTML = '';

        for (let i = 1; i <= maxWrong; i++) {
            document.getElementById(`part-${i}`).style.display = 'none';
        }

        createKeyboard();
        updateDisplay();
    }

    function updateDisplay() {
        let display = '';
        let isWin = true;

        for (let char of secretWord) {
            if (guessedLetters.includes(char)) {
                display += char + ' ';
            } else {
                display += '_ ';
                isWin = false;
            }
        }

        document.getElementById('word-display').innerText = display.trim();

        if (isWin && secretWord.length > 0) {
            streak++;
            document.getElementById('streak').innerText = `🔥 ต่อเนื่อง: ${streak}`;
            document.getElementById('mascot').innerText = '🥳';
            document.getElementById('message').innerText = '🎉 เก่งมาก! ทายถูกแล้ว!';
            document.getElementById('message').className = 'win';
            disableAllKeys();
            showNextRoundButton();
            triggerFireworks();
        }
    }

    function handleGuess(letter) {
        const keyBtn = document.getElementById(`key-${letter}`);
        keyBtn.disabled = true;

        if (secretWord.includes(letter)) {
            keyBtn.classList.add('correct');
            guessedLetters.push(letter);
            updateDisplay();
        } else {
            keyBtn.classList.add('wrong');
            wrongGuesses++;
            if (wrongGuesses <= maxWrong) {
                document.getElementById(`part-${wrongGuesses}`).style.display = 'inline';
            }

            if (wrongGuesses === maxWrong) {
                streak = 0;
                document.getElementById('streak').innerText = `🔥 ต่อเนื่อง: ${streak}`;
                document.getElementById('mascot').innerText = '😭';
                
                // เฉลยคำศัพท์ที่ถูกต้องเมื่อแพ้
                document.getElementById('message').innerText = `❌ เสียใจด้วย! เฉลยคำว่า: ${secretWord}`;
                document.getElementById('message').className = 'lose';
                document.getElementById('word-display').innerText = secretWord.split('').join(' ');
                
                disableAllKeys();
                showNextRoundButton();
                triggerSadEffect();
            }
        }
    }

    function disableAllKeys() {
        document.querySelectorAll('.key').forEach(btn => btn.disabled = true);
    }

    function showNextRoundButton() {
        const box = document.getElementById('next-round-box');
        box.innerHTML = '';
        const btn = document.createElement('button');
        btn.className = 'btn-next';
        btn.innerText = '➡️ คำถัดไป';
        btn.onclick = startRound;
        box.appendChild(btn);
    }

    /* ------------------ เอฟเฟกต์พลุ (เมื่อชนะ) ------------------ */
    function triggerFireworks() {
        const colors = ['#FFC93C', '#FF6B6B', '#38BDF8', '#2ED9A6', '#6C5CE7'];
        for (let i = 0; i < 3; i++) {
            setTimeout(() => {
                const startX = Math.random() * (window.innerWidth - 100) + 50;
                const startY = Math.random() * (window.innerHeight / 2) + 100;

                for (let p = 0; p < 30; p++) {
                    const particle = document.createElement('div');
                    particle.className = 'firework-particle';
                    particle.style.left = startX + 'px';
                    particle.style.top = startY + 'px';
                    particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 120 + 40;
                    particle.style.setProperty('--dx', Math.cos(angle) * speed + 'px');
                    particle.style.setProperty('--dy', Math.sin(angle) * speed + 'px');

                    document.body.appendChild(particle);
                    setTimeout(() => particle.remove(), 1000);
                }
            }, i * 300);
        }
    }

    /* ------------------ เอฟเฟกต์ความเศร้า (เมื่อแพ้) ------------------ */
    function triggerSadEffect() {
        const sadEmojis = ['💧', '😭', '💔', '🌧️'];
        for (let i = 0; i < 25; i++) {
            setTimeout(() => {
                const drop = document.createElement('div');
                drop.className = 'sad-drop';
                drop.innerText = sadEmojis[Math.floor(Math.random() * sadEmojis.length)];
                drop.style.left = Math.random() * 100 + 'vw';
                drop.style.animationDuration = (1.5 + Math.random() * 1) + 's';
                document.body.appendChild(drop);
                setTimeout(() => drop.remove(), 2500);
            }, i * 100);
        }
    }

    // เริ่มเกมครั้งแรก
    startRound();
</script>

</body>
</html>
